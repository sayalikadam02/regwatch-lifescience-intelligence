<!DOCTYPE html>
<html lang="en">

    <style>
        :root {
            --primary-blue: #0047ab;
            --sidebar-bg: #f8fafc;
            --card-border: #e2e8f0;

            --text-light: #64748b;
            --high-impact: #fee2e2;
            --high-impact-text: #991b1b;
            --med-impact: #fef3c7;
            --med-impact-text: #92400e;
            --tag-blue: #dbeafe;
            --tag-blue-text: #1e40af;
            --live-green: #dcfce7;
            --live-green-text: #166534;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background-color: #ffffff; color: var(--text-dark); overflow: hidden; }
        .app-wrapper { display: flex; height: 100vh; width: 100vw; }

        .sidebar { width: 290px; background: var(--sidebar-bg); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; padding: 24px; flex-shrink: 0; overflow-y: auto; height: 100%; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 30px; }
        
        .nav-group { margin-bottom: 30px; }
        .nav-item { display: flex; align-items: center; padding: 10px 12px; border-radius: 8px; color: var(--text-light); font-size: 0.9rem; font-weight: 500; margin-bottom: 4px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { background: #eff6ff; color: var(--primary-blue); font-weight: 600; }

        .filter-section { margin-bottom: 25px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .filter-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 800; margin-bottom: 15px; }
        .filter-label { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; margin-bottom: 10px; cursor: pointer; color: var(--text-dark); }
        .filter-label input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary-blue); }

        .date-input-group { margin-bottom: 15px; }
        .date-input-group label { display: block; font-size: 0.75rem; color: var(--text-light); margin-bottom: 5px; }
        .date-field { width: 100%; padding: 8px; border: 1px solid var(--card-border); border-radius: 6px; font-family: inherit; font-size: 0.85rem; outline: none; }

        .main-container { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .top-bar { height: 72px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); background: white; flex-shrink: 0; }
        .search-wrapper { width: 450px; }
        .search-input { width: 100%; padding: 12px 16px; border: 1px solid var(--card-border); border-radius: 10px; background: #f8fafc; font-size: 0.95rem; outline: none; }

        .fetch-btn { background: var(--primary-blue); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .content-scroll { flex: 1; overflow-y: auto; padding: 40px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; }

        .card { background: white; border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); }

        .tag-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .tag { font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .tag-agency { background: var(--tag-blue); color: var(--tag-blue-text); }
        .tag-type { background: #f1f5f9; color: #475569; }
        .tag-impact { margin-left: auto; }
        .impact-high { background: var(--high-impact); color: var(--high-impact-text); }
        .impact-med { background: var(--med-impact); color: var(--med-impact-text); }

        .card-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 12px 0; line-height: 1.4; color: #0f172a; }
        .card-desc { font-size: 0.95rem; color: var(--text-light); line-height: 1.6; margin-bottom: 24px; flex-grow: 1; }
        .card-footer { padding-top: 16px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #94a3b8; }
        .source-link { color: var(--primary-blue); font-weight: 700; text-decoration: none; }

        .spinner { width: 16px; height: 16px; border: 2px solid white; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>

    { 
        title: "TGA: Adoption of EU Guidelines for Clinical Investigation of Medicines", 
        desc: "Formal alignment of Australian clinical trial requirements with European Union standards (EMEA/CHMP).", 
        agency: "TGA (Australia)", industry: "General Healthcare", type: "Regulation", 
        impact: "Medium Impact", iClass: "impact-med", date: "2023-06-30", 
        url: "https://www.tga.gov.au", view: "archive" 
    },
    { 
        title: "PMDA: New Electronic Submission Standards (XML)", 
        desc: "Mandatory requirement for electronic submission of clinical study reports and case report forms for new drug applications.", 
        agency: "PMDA (Japan)", industry: "Biopharma", type: "Regulation", 
        impact: "Medium Impact", iClass: "impact-med", date: "2023-04-01", 
        url: "https://www.pmda.go.jp", view: "archive" 
    }
];

    let currentView = 'dashboard';

    function render() {
        const grid = document.getElementById('cardGrid');
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        const start = new Date(document.getElementById('date-start').value);
        const end = new Date(document.getElementById('date-end').value);

        const activeAgencies = Array.from(document.querySelectorAll('.agency-cb:checked')).map(cb => cb.value);
        const activeIndustries = Array.from(document.querySelectorAll('.ind-cb:checked')).map(cb => cb.value);
        const activeTypes = Array.from(document.querySelectorAll('.type-cb:checked')).map(cb => cb.value);

        grid.innerHTML = '';

        let filtered = allUpdates.filter(item => {
            const itemDate = new Date(item.date);
            const matchesTab = (currentView === item.view);
            const matchesAgency = activeAgencies.includes(item.agency);
            const matchesIndustry = activeIndustries.includes(item.industry);
            const matchesType = activeTypes.includes(item.type);
            const matchesDate = itemDate >= start && itemDate <= end;
            const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.desc.toLowerCase().includes(searchQuery);

            return matchesTab && matchesAgency && matchesIndustry && matchesType && matchesDate && matchesSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 100px 0; color: #94a3b8;">No results match your criteria.</div>`;
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="tag-row">
                    <span class="tag tag-agency">${item.agency}</span>
                    <span class="tag tag-type">${item.type}</span>
                    <span class="tag tag-impact ${item.iClass}">${item.impact}</span>
                </div>
                <h3 class="card-title">${item.title}</h3>
                <p class="card-desc">${item.desc}</p>
                <div class="card-footer">
                    <span>📅 ${item.date}</span>
                    <a href="${item.url}" target="_blank" class="source-link">Source Page ↗</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function switchView(viewId) {
        currentView = viewId;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`nav-${viewId}`).classList.add('active');
        document.getElementById('viewTitle').innerText = (viewId === 'dashboard') ? '2025 Regulatory Dashboard' : 'Historical Archive (2023-24)';
        render();
    }

    function fetchUpdates() {
        const btn = document.getElementById('fetchBtn'), spinner = document.getElementById('btnSpinner'), label = document.getElementById('btnLabel');
        btn.disabled = true; spinner.style.display = 'block'; label.style.display = 'none';
        setTimeout(() => {
            btn.disabled = false; spinner.style.display = 'none'; label.style.display = 'block';
            document.getElementById('scanTime').innerText = new Date().toDateString();
            render();
        }, 800);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.filter-cb, .date-field').forEach(el => el.addEventListener('change', render));
        document.getElementById('searchInput').addEventListener('keyup', render);
        render();
    });
</script>
</body>
</html>
