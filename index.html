<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegWatch | Revvity Regulatory Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0047ab;
            --sync-blue: #5bc0de;
            --sidebar-bg: #f8fafc;
            --card-border: #e2e8f0;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --impact-bg: #fff7ed;
            --impact-border: #fed7aa;
            --impact-header: #9a3412;
            --impact-content: #7c2d12;
            --live-green: #40916c;
        }

        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Inter', sans-serif; 
            background-color: #fcfcfc; 
            color: var(--text-dark); 
            overflow: hidden; 
            font-size: 13.5px; 
        }

        .app-wrapper { display: flex; height: 100vh; width: 100vw; }

        /* Sidebar Navigation */
        .sidebar { width: 280px; background: white; border-right: 1px solid var(--card-border); display: flex; flex-direction: column; flex-shrink: 0; height: 100%; }
        .sidebar-header { padding: 24px; border-bottom: 1px solid #f1f5f9; font-weight: 800; color: var(--primary-blue); font-size: 1.1rem; letter-spacing: -0.02em; }
        
        .sidebar-scroll { flex: 1; overflow-y: auto; padding: 20px; }

        .nav-group { margin-bottom: 24px; }
        .nav-item { padding: 8px 14px; border-radius: 6px; color: var(--text-light); font-weight: 500; cursor: pointer; transition: 0.2s; margin-bottom: 2px; }
        .nav-item:hover { background: #f8fafc; color: var(--text-dark); }
        .nav-item.active { background: #eff6ff; color: var(--primary-blue); font-weight: 700; }

        /* Filter Pane Styles */
        .filter-section { margin-bottom: 24px; }
        .filter-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 700; margin-bottom: 12px; }
        
        .select-all-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .select-all-label { font-size: 0.85rem; font-weight: 500; color: var(--text-dark); }

        .filter-label { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; margin-bottom: 8px; cursor: pointer; color: var(--text-dark); }
        .filter-label input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--primary-blue); }

        .date-box { background: #f8fafc; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; margin-top: 10px; }
        .date-field { width: 100%; padding: 6px; border: 1px solid var(--card-border); border-radius: 4px; font-size: 0.8rem; margin-top: 5px; outline: none; }

        /* Main Container */
        .main-container { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f8fafc; }
        .top-bar { height: 80px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 1px solid var(--card-border); }
        
        .search-input { width: 400px; padding: 10px 16px; border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.9rem; outline: none; background: #f8fafc; }

        /* Sync Button Logic */
        .sync-container { display: flex; flex-direction: column; align-items: flex-end; }
        .sync-status { font-size: 0.85rem; color: #40916c; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; font-weight: 500; }
        .sync-btn { background: var(--sync-blue); color: white; border: none; padding: 8px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }

        .content-scroll { flex: 1; overflow-y: auto; padding: 30px 40px; }

        /* Card Elements */
        .card-list { display: flex; flex-direction: column; gap: 16px; max-width: 1000px; }
        .card { background: white; border: 1px solid var(--card-border); border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        
        .tag-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .tag { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; background: #f1f5f9; color: #475569; }
        
        .impact-high { background: #fee2e2 !important; color: #991b1b !important; margin-left: auto; }
        .impact-med { background: #fef3c7 !important; color: #92400e !important; margin-left: auto; }

        .card-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 10px 0; line-height: 1.3; color: var(--text-dark); }
        
        .label-sm { font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block; }
        .summary-text { font-size: 0.9rem; line-height: 1.5; color: var(--text-light); margin-bottom: 15px; border-left: 2px solid #e2e8f0; padding-left: 12px; }
        .desc-text { font-size: 0.92rem; line-height: 1.5; color: var(--text-dark); margin-bottom: 15px; }

        .impact-box { background: var(--impact-bg); border: 1px solid var(--impact-border); border-radius: 6px; padding: 14px; margin-bottom: 15px; }
        .impact-header { color: var(--impact-header); font-weight: 700; font-size: 0.8rem; margin-bottom: 4px; }
        .impact-text { color: var(--impact-content); font-size: 0.85rem; line-height: 1.5; }

        .card-footer { padding-top: 12px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .meta-text { font-size: 0.75rem; color: #94a3b8; }
        .source-link { color: var(--primary-blue); font-weight: 700; text-decoration: none; font-size: 0.8rem; }

        .roundup-section { margin-bottom: 35px; border-left: 3px solid var(--primary-blue); padding-left: 20px; }
        .month-name { font-size: 1.4rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 15px; }

        .spinner { width: 12px; height: 12px; border: 2px solid white; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">

        <div class="sidebar-scroll">

                    <input type="checkbox" checked id="sa-ind">

                </div>

                <label class="filter-label"><input type="checkbox" checked value="Biopharma" class="filter-cb ind-cb"> Biopharma</label>
                <label class="filter-label"><input type="checkbox" checked value="Biotech" class="filter-cb ind-cb"> Biotech</label>
                <label class="filter-label"><input type="checkbox" checked value="MedTech" class="filter-cb ind-cb"> MedTech</label>
                <label class="filter-label"><input type="checkbox" checked value="General Healthcare" class="filter-cb ind-cb"> General Healthcare</label>
            </div>

            <div class="filter-section">
                <div class="filter-title">Update Type</div>
                <div class="select-all-wrapper" onclick="toggleGroup('type-cb', this)">
                    <input type="checkbox" checked id="sa-type">
                    <label class="select-all-label">Select All</label>
                </div>
                <label class="filter-label"><input type="checkbox" checked value="Guidance Draft" class="filter-cb type-cb"> Guidance Draft</label>
                <label class="filter-label"><input type="checkbox" checked value="Guidance Final" class="filter-cb type-cb"> Guidance Final</label>
                <label class="filter-label"><input type="checkbox" checked value="Regulation" class="filter-cb type-cb"> Regulation</label>
                <label class="filter-label"><input type="checkbox" checked value="Product Approval" class="filter-cb type-cb"> Product Approval</label>
                <label class="filter-label"><input type="checkbox" checked value="News" class="filter-cb type-cb"> News</label>
            </div>

            <div class="filter-section">
                <div class="filter-title">Date Range</div>
                <div class="date-box">
                    <input type="date" id="date-start" class="date-field" value="2023-01-01" onchange="render()">
                    <input type="date" id="date-end" class="date-field" value="2026-12-31" onchange="render()">
                </div>
            </div>
        </div>
    </aside>

    <main class="main-container">
        <header class="top-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search" onkeyup="render()">
            <div class="sync-container">
                <div class="sync-status" id="syncStatus">Last Synced 1 minute ago <span style="font-size:0.6rem">▼</span></div>
                <button class="sync-btn" onclick="syncData()">
                    <div class="spinner" id="syncSpinner"></div>
                    <span id="syncLabel">Sync now</span>
                </button>
            </div>
        </header>

        <section class="content-scroll">
            <h1 style="margin:0 0 20px 0; font-size: 1.5rem; font-weight: 800;" id="viewTitle">Life Science Regulatory Dashboard</h1>
            <div id="mainDisplay"></div>
        </section>
    </main>
</div>

        desc: "Joint HMA/EMA statement confirming that biosimilars approved in the EU are interchangeable with their reference products.", 
        agency: "EMA (EU)", industry: "Biopharma", type: "News", 
        impact: "High Impact", iClass: "impact-high", date: "2023-09-15", 
        url: "https://www.ema.europa.eu", view: "archive" 
    },
    { 
        title: "NMPA: Technical Guidelines for Clinical Trials of Oncolytic Viruses", 
        desc: "Standardizing the design and endpoint selection for gene-modified viral therapies in oncology.", 
        agency: "NMPA (China)", industry: "Biotech", type: "Guidance Final", 
        impact: "Medium Impact", iClass: "impact-med", date: "2023-08-10", 
        url: "https://www.nmpa.gov.cn", view: "archive" 
    },
    { 
        title: "TGA: Adoption of EU Guidelines for Clinical Investigation of Medicines", 
        desc: "Formal alignment of Australian clinical trial requirements with European Union standards (EMEA/CHMP).", 
        agency: "TGA (Australia)", industry: "General Healthcare", type: "Regulation", 
        impact: "Medium Impact", iClass: "impact-med", date: "2023-06-30", 
        url: "https://www.tga.gov.au", view: "archive" 
    },
    { 
        title: "PMDA: New Electronic Submission Standards (XML)", 
        desc: "Mandatory requirement for electronic submission of clinical study reports and case report forms for new drug applications.", 
        agency: "PMDA (Japan)", industry: "Biopharma", type: "Regulation", 
        impact: "Medium Impact", iClass: "impact-med", date: "2023-04-01", 
        url: "https://www.pmda.go.jp", view: "archive" 
    },
    ];
    let currentView = 'dashboard';

    function setGroup(className, isChecked) {
        document.querySelectorAll('.' + className).forEach(cb => cb.checked = isChecked);
        render();
    }

    function toggleGroup(className, wrapper) {
        const checkbox = wrapper.querySelector('input');
        if (event.target.type !== 'checkbox') checkbox.checked = !checkbox.checked;
        setGroup(className, checkbox.checked);
    }

    function switchView(viewId) {
        currentView = viewId;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`nav-${viewId}`).classList.add('active');
        const titles = { 'dashboard': 'Dashboard', 'roundup': 'Monthly Round Up', 'archive': 'Archive' };
        document.getElementById('viewTitle').innerText = titles[viewId];
        render();
    }

    function createCardHTML(item) {
        const isDashboard = (currentView === 'dashboard');

        let middleContent = '';
        if (isDashboard) {
            middleContent = `
                <span class="label-sm">Executive Summary</span>
                <div class="summary-text">${item.summary}</div>
                <div class="impact-box">
                    <div class="impact-header">Revvity Business & Material Impact Analysis</div>
                    <div class="impact-text">${item.impactAnalysis}</div>
                </div>
            `;
        } else {
            // SHOW DESCRIPTION IN ROUNDUP AND ARCHIVE
            middleContent = `<div class="desc-text">${item.desc}</div>`;
        }

        return `
            <div class="card">
                <div class="tag-row">
                    <span class="tag">${item.agency}</span>
                    <span class="tag">${item.type}</span>
                    <span class="tag ${item.iClass}">${item.impact}</span>
                </div>
                <h2 class="card-title">${item.title}</h2>
                ${middleContent}
                <div class="card-footer">
                    <span class="meta-text">📅 ${item.date}</span>
                    <a href="${item.url}" target="_blank" class="source-link">Source Page ↗</a>
                </div>
            </div>
        `;
    }

    function render() {
        const display = document.getElementById('mainDisplay');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const start = new Date(document.getElementById('date-start').value);
        const end = new Date(document.getElementById('date-end').value);
        
        const activeAgencies = Array.from(document.querySelectorAll('.agency-cb:checked')).map(cb => cb.value);
        const activeTypes = Array.from(document.querySelectorAll('.type-cb:checked')).map(cb => cb.value);
        const activeIndustries = Array.from(document.querySelectorAll('.ind-cb:checked')).map(cb => cb.value);

        display.innerHTML = '';

        let filtered = allUpdates.filter(item => {
            const itemDate = new Date(item.date);
            let matchesView = (item.view === currentView);
            if (currentView === 'roundup') matchesView = (item.view === 'dashboard' && item.impact === "High Impact");

            const matchesSearch = item.title.toLowerCase().includes(search);
            const matchesFilters = activeAgencies.includes(item.agency) && activeTypes.includes(item.type) && activeIndustries.includes(item.industry);
            const matchesDate = itemDate >= start && itemDate <= end;
            
            return matchesView && matchesSearch && matchesFilters && matchesDate;
        });

        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (currentView === 'roundup') {
            const months = {};
            filtered.forEach(item => {
                const m = new Date(item.date).toLocaleString('default', { month: 'long', year: 'numeric' });
                if (!months[m]) months[m] = [];
                months[m].push(item);
            });
            Object.keys(months).forEach(month => {
                const section = document.createElement('div');
                section.className = 'roundup-section';
                section.innerHTML = `<div class="month-name">${month}</div>`;
                const innerList = document.createElement('div');
                innerList.className = 'card-list';
                months[month].forEach(item => innerList.innerHTML += createCardHTML(item));
                section.appendChild(innerList);
                display.appendChild(section);
            });
        } else {
            const list = document.createElement('div');
            list.className = 'card-list';
            filtered.forEach(item => list.innerHTML += createCardHTML(item));
            display.appendChild(list);
        }
    }

    function syncData() {
        const btn = document.querySelector('.sync-btn'), spinner = document.getElementById('syncSpinner'), label = document.getElementById('syncLabel');
        btn.disabled = true; spinner.style.display = 'block'; label.style.display = 'none';
        setTimeout(() => {
            btn.disabled = false; spinner.style.display = 'none'; label.style.display = 'block';
            document.getElementById('syncStatus').innerHTML = `Last Synced just now <span style="font-size:0.6rem">▼</span>`;
            render();
        }, 800);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.filter-cb').forEach(el => el.addEventListener('change', render));
        render();
    });
</script>
</body>
</html>
